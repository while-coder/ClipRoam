name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        uses: while-coder/workflows/.github/actions/resolve-release-info@main
        with:
          tag-prefix: v
          package-json: package.json
          changelog: CHANGELOG.md

  prepare-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Recreate GitHub Release
        uses: while-coder/workflows/.github/actions/recreate-github-release@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.check.outputs.tag }}
          target: ${{ github.sha }}
          title: ClipRoam v${{ needs.check.outputs.version }}
          notes: ${{ needs.check.outputs.notes }}

  desktop:
    needs: [check, prepare-release]
    uses: while-coder/workflows/.github/workflows/tauri-desktop-release.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      release-name: ClipRoam v${{ needs.check.outputs.version }}
      release-body: ${{ needs.check.outputs.notes }}
      release-owner: while-coder
      release-repo: ClipRoam
    secrets: inherit

  android:
    needs: [check, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-android-release.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      asset-prefix: ClipRoam
      release-repository: while-coder/ClipRoam
      init-command: pnpm android:init
      build-command: pnpm tauri android build --apk --aab --ci
    secrets: inherit

  ios:
    needs: [check, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-ios-unsigned.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      asset-prefix: ClipRoam
      release-repository: while-coder/ClipRoam
      init-command: pnpm ios:init
      build-command: pnpm tauri ios build --target aarch64 --no-sign --ci
    secrets: inherit

  publish-sidestore:
    name: Update SideStore source
    needs: [check, ios]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-sidestore
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Read SideStore app metadata
        env:
          RELEASE_REPOSITORY: while-coder/ClipRoam
          TAG: ${{ needs.check.outputs.tag }}
        run: node apps/app/src-tauri/native/ios/sidestore-info.cjs > "$RUNNER_TEMP/cliproam-sidestore.json"

      - name: Update store/sidestore.json
        uses: while-coder/workflows/.github/actions/update-sidestore@main
        with:
          app-info: ${{ runner.temp }}/cliproam-sidestore.json
          asset-name: ClipRoam_${{ needs.check.outputs.version }}_ios_unsigned.ipa
          tag: ${{ needs.check.outputs.tag }}
          version: ${{ needs.check.outputs.version }}
          release-repository: while-coder/ClipRoam
          store-repository: while-coder/store
          notes: ${{ needs.check.outputs.notes }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_TOKEN: ${{ fromJSON(secrets.BUILD_SETTINGS || '{}').STORE_TOKEN }}

  publish-manifest:
    needs: [check, desktop, android, ios]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-updater-manifest.yml@main
    with:
      product-prefix: ClipRoam
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      release-notes: ${{ needs.check.outputs.notes }}
    secrets: inherit

  deploy-pwa:
    needs: [check, prepare-release]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pwa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: while-coder/workflows/.github/actions/install-pnpm-dependencies@main

      - name: Synchronize versions
        run: pnpm sync:versions

      - name: Build PWA
        run: pnpm build:pwa
        env:
          PWA_BASE: /ClipRoam/

      - name: Publish PWA to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/pwa/dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy PWA ${{ needs.check.outputs.tag }}

  release-extensions:
    name: Release ${{ matrix.browser }} extension
    needs: [check, prepare-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: while-coder/workflows/.github/actions/install-pnpm-dependencies@main

      - name: Synchronize versions
        run: pnpm sync:versions

      - name: Build extension
        run: pnpm build:${{ matrix.browser }}

      - name: Package extension
        working-directory: apps/${{ matrix.browser }}/dist
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BROWSER: ${{ matrix.browser }}
        run: zip -r "../../../ClipRoam_${VERSION}_${BROWSER}.zip" .

      - name: Upload extension to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          BROWSER: ${{ matrix.browser }}
        run: gh release upload "$TAG" "ClipRoam_${VERSION}_${BROWSER}.zip" --clobber

  release-vscode:
    name: Release VS Code extension
    needs: [check, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: while-coder/workflows/.github/actions/install-pnpm-dependencies@main
      - name: Synchronize versions
        run: pnpm sync:versions
      - name: Package VS Code extension
        run: pnpm package:vscode
      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp apps/vscode/dist/cliproam.vsix "ClipRoam_${VERSION}_vscode.vsix"
          gh release upload "$TAG" "ClipRoam_${VERSION}_vscode.vsix" --clobber

  docker:
    needs: [check, prepare-release]
    permissions:
      contents: write
      packages: write
    uses: while-coder/workflows/.github/workflows/docker-ghcr-release.yml@main
    with:
      version: ${{ needs.check.outputs.version }}
      context: apps/server/dist
      dockerfile: apps/server/Dockerfile
      setup-pnpm: true
      build-command: pnpm build:server
      release-tag: ${{ needs.check.outputs.tag }}
      archive-name: cliproam-server.tar
