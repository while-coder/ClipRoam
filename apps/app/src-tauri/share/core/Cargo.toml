[package]
name = "cliproam-share-upload"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
core-foundation = "0.10"
security-framework-sys = "2"

[dev-dependencies]
tempfile = "3"
