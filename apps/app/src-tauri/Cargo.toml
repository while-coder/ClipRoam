[package]
name = "cliproam"
version = "0.1.0"
description = "A private, cross-platform clipboard history and roaming client"
authors = ["while"]
edition = "2021"

[lib]
name = "cliproam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# 桌面端通用插件与对话框（platforms/desktop 对所有桌面平台无条件注册）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rfd = "0.15"

# macOS 上 WKWebView 透明背景走私有 API（toast 窗口 transparent: true 依赖它）
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# 辅助功能权限检测与授权弹窗（AXIsProcessTrustedWithOptions，见 macos/mod.rs）
core-foundation = "0.10"
# 原生焦点恢复和按键投递，避免额外的 Apple Events 自动化权限。
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSEvent", "NSScreen", "NSWindow"] }

[dependencies.tauri-updater-kit]
git = "https://github.com/while-coder/tauri-updater-kit"
branch = "main"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cliproam-share-receiver = { path = "plugins/share-receiver" }
