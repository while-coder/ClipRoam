[package]
name = "cliproam"
version = "0.1.0"
description = "A private, cross-platform clipboard history and roaming client"
authors = ["while"]
edition = "2021"

[lib]
name = "cliproam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
# 下载管理器直连拉流：stream 提供 bytes_stream。TLS 用 rustls，但 provider
# 显式选 ring（tauri/updater 已在用，依赖树里现成）——reqwest 默认的
# aws-lc-rs 在 rsproxy 镜像上缺新版本，拉不下来。
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"

[dev-dependencies]
# Compiles the shared macOS/Linux clipboard wrapper during Windows tests too,
# catching arboard API drift even when native SDKs are unavailable.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# 桌面端通用插件与对话框（platforms/desktop 对所有桌面平台无条件注册）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rfd = "0.15"

# macOS 上 WKWebView 透明背景走私有 API（toast 窗口 transparent: true 依赖它）
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# 辅助功能权限检测与授权弹窗（AXIsProcessTrustedWithOptions，见 macos/mod.rs）
core-foundation = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dependencies.tauri-updater-kit]
git = "https://github.com/while-coder/tauri-updater-kit"
branch = "main"

# session_token 存系统凭据库（见 sync/token_store.rs）：按平台分节声明
# 后端 feature，避免把 zbus 等无关依赖带进其他目标。Android 无 keyring
# 支持，token 随配置文件留在应用沙箱。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cliproam-share-receiver = { path = "plugins/share-receiver" }
