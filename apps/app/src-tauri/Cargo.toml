[package]
name = "cliproam"
version = "0.1.0"
description = "A private, cross-platform clipboard history and roaming client"
authors = ["while"]
edition = "2021"

[lib]
name = "cliproam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
# Compiles the shared macOS/Linux clipboard wrapper during Windows tests too,
# catching arboard API drift even when native SDKs are unavailable.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rfd = "0.15"

[dependencies.tauri-updater-kit]
git = "https://github.com/while-coder/tauri-updater-kit"
branch = "main"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cliproam-share-receiver = { path = "plugins/share-receiver" }
