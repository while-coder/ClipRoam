[package]
name = "cliproam"
version = "0.1.0"
description = "A private, cross-platform clipboard history and roaming client"
authors = ["ClipRoam contributors"]
edition = "2021"

[lib]
name = "cliproam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "webp"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
